name: cb-feed

on:
  schedule:
    # 每天 01:00 UTC = 北京时间 09:00
    - cron: '0 1 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'cb_config.json'
      - 'cb_scraper.js'
      - '.github/workflows/cb.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build cb.json
        run: node cb_scraper.js

      - name: Commit cb.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cb.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "chore: update cb.json"
            git push
          fi
